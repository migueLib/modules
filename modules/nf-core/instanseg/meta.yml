---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "instanseg"
description: Instanseg segmentation for 2D images
keywords:
  - imaging
  - segmentation
  - microscopy
  - fluorescence
tools:
  - "instanseg":
      description: "InstanSeg is a pytorch-based cell and nucleus segmentation pipeline for fluorescence and brightfield microscopy images. This README provides instructions for setting up the environment, installing dependencies, and using the provided tools and models."
      homepage: "https://github.com/instanseg/instanseg"
      documentation: "https://github.com/instanseg/instanseg"
      tool_dev_url: "https://github.com/instanseg/instanseg"
      doi: "10.1101/2024.09.04.611150"
      licence: ["Apache-2.0 license"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample' ]`

    - image:
        type: file
        description: Single-channel, single-time-point, 2D TIFF.
        pattern: "*.{tiff,tif}"


output:
  - label_mask:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample']`

    - "*.stardist.tif":
        type: file
        description: Label mask output from Stardist in TIFF format, it will preserve the XY shape of the input image.
        pattern: "*.{tif,tiff}"

  - versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@migueLib"
maintainers:
  - "@migueLib"
